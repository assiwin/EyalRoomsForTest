name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: 'python -m pip install --only-binary=:all: -r requirements.txt pyinstaller==6.16.0'
      - name: Build application
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name ExamRoomApp --icon "assets\app_icon.ico"
          --collect-all scipy --collect-all numpy --collect-all reportlab
          --add-data "web;web" --add-data "assets;assets" app.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ExamRoomApp_Setup_v9
          path: installer_output/ExamRoomApp_Setup_v9.exe
          if-no-files-found: error
